# Canopée : nginx derrière le proxy de Coolify (Traefik/Caddy fait le HTTPS)

# URL versionnées (?v=…, modules et données des maquettes) : cache long ; le reste : cache court
map $arg_v $canopee_cache {
  ""      "public, max-age=3600";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain image/svg+xml;

  # types MIME : ceux de mime.types (html, js, json, webp, bin…), hérités du bloc http de nginx.conf.
  # Surtout pas de bloc « types { } » ici : il remplacerait toute la table au lieu de la compléter, et les
  # pages partiraient en application/octet-stream (le navigateur les télécharge au lieu de les afficher).

  # compression : les données de la ville (JSON 1,6 Mo, binaire 1 Mo) et les modules JS se compressent bien
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml
             image/svg+xml model/gltf+json application/octet-stream application/wasm;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # fichiers internes du dépôt qui n'ont rien à faire en ligne
  location ~ (^|/)(\.|SPEC\.md$|outils/) { return 404; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # pages HTML : toujours revalidées, pour que les nouvelles versions (?v=) soient prises tout de suite
  location ~* \.html?$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control $canopee_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ $uri/index.html =404;
  }

}
