<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo 3D Canopée</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b214a'/%3E%3Cpath d='M9 25V10h14v15M9 15h14M9 20h14' stroke='%23145cff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0b214a;--bleu:#145cff;--bg:#ffffff;--fg:#0b214a;--line:rgba(11,33,74,.14)}
:root[data-fond="nuit"]{--bg:#0b214a;--fg:#ffffff;--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Jost,system-ui,sans-serif;transition:background .4s,color .4s}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
.bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar button{font:500 13px/1 Jost,sans-serif;letter-spacing:.04em;color:var(--fg);background:none;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--bleu);color:#fff}
.bar button:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
.top{position:fixed;left:24px;top:22px;font:500 11px/1 Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
.top a{color:inherit;text-decoration:none}
.load{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;letter-spacing:.08em;opacity:.6;pointer-events:none;transition:opacity .4s}
@media (max-width:560px){.bar{bottom:16px;max-width:calc(100% - 32px);overflow-x:auto}.bar button{padding:10px 12px}}
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" aria-label="Logo Canopée en 3D, faites glisser pour le tourner"></canvas>
<div class="top"><a href="../">Canopée</a> · logo 3D</div>
<div class="load" id="load">Chargement…</div>
<div class="bar" role="toolbar" aria-label="Réglages">
  <button data-vue="signature" aria-pressed="true">Signature</button>
  <button data-vue="symbole" aria-pressed="false">Symbole</button>
  <button id="fond" aria-pressed="false">Fond nuit</button>
  <button id="png">PNG</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import opentype from 'three/addons/libs/opentype.module.js';

const NUIT = new THREE.Color('#0b214a'), BLEU = new THREE.Color('#145cff');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.25; controls.maxPolarAngle = Math.PI * 0.6;
controls.minAzimuthAngle = -Math.PI * 0.45; controls.maxAzimuthAngle = Math.PI * 0.45;

// lumière : clé douce en hauteur, contre-jour bleuté, ombre portée au sol
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-5, 9, 9); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 16; key.shadow.blurSamples = 24; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xa9c4ff, 1.5); rim.position.set(7, 4, -7); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fa3c8, 0.4));

// matières : laque bleu nuit, bleu électrique satiné
const matNuit = new THREE.MeshPhysicalMaterial({ color: NUIT, roughness: 0.38, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.14, envMapIntensity: 0.45 });
const matBleu = new THREE.MeshPhysicalMaterial({ color: BLEU, roughness: 0.26, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.08, emissive: BLEU, emissiveIntensity: 0.22, envMapIntensity: 0.55 });
const sol = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.16 }));
sol.rotation.x = -Math.PI / 2; sol.receiveShadow = true; scene.add(sol);

function mesh(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }
function roundedRect(x0, y0, x1, y1, r) {
  const s = new THREE.Shape();
  s.moveTo(x0 + r, y0); s.lineTo(x1 - r, y0); s.quadraticCurveTo(x1, y0, x1, y0 + r);
  s.lineTo(x1, y1 - r); s.quadraticCurveTo(x1, y1, x1 - r, y1); s.lineTo(x0 + r, y1);
  s.quadraticCurveTo(x0, y1, x0, y1 - r); s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
  return s;
}
const extrude = (shape, depth, bevel = 0.04, seg = 10) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 8, curveSegments: seg });
  g.translate(0, 0, -depth / 2); g.computeVertexNormals(); return g;
};

/* ---------- symbole : la résidence et sa canopée ----------
   Trois dalles décalées (les trois étages et leurs balcons en porte-à-faux),
   sous une feuille bleu électrique fendue par sa nervure (le toit-jardin). */
const symbole = new THREE.Group();
const D = 1.4;                                          // profondeur : un vrai petit volume bâti
[[-2.05, -0.22], [-1.2, 0.22], [-0.35, -0.22]].forEach(([y, dx]) => {
  symbole.add(mesh(extrude(roundedRect(-1.45 + dx, y, 1.45 + dx, y + 0.46, 0.07), D), matNuit));
});
// feuille : deux arcs, fendue en diagonale par la nervure
function demiFeuille(haut) {
  const s = new THREE.Shape(), L = 1.85, H = 0.78, g = 0.07, N = 60;
  const pts = [];
  for (let i = 0; i <= N; i++) { const t = -1 + 2 * i / N; pts.push(new THREE.Vector2(t * L, (haut ? 1 : -1) * (H * (1 - t * t) * (1 + 0.18 * t) + g))); }
  s.moveTo(pts[0].x, (haut ? 1 : -1) * g);
  pts.forEach(p => s.lineTo(p.x, p.y));
  s.lineTo(L, (haut ? 1 : -1) * g); s.closePath();
  return s;
}
const canopee = new THREE.Group();
canopee.add(mesh(extrude(demiFeuille(true), 0.55, 0.05, 64), matBleu), mesh(extrude(demiFeuille(false), 0.55, 0.05, 64), matBleu));
canopee.rotation.z = 0.2; canopee.position.set(0.1, 1.2, 0.2); symbole.add(canopee);
symbole.scale.setScalar(1.22); symbole.position.y = 0.55;

/* ---------- mot-symbole Canopée / RÉSIDENCE ---------- */
const FONTS = {
  mont: 'https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.8/files/montserrat-latin-700-normal.woff',
  jost: 'https://cdn.jsdelivr.net/npm/@fontsource/jost@5.0.8/files/jost-latin-400-normal.woff',
};
const loadFont = (u) => fetch(u).then(r => r.arrayBuffer()).then(b => opentype.parse(b));
function glyphShapes(path) {
  const sp = new THREE.ShapePath(); let any = false;
  for (const c of path.commands) {
    if (c.type === 'M') { sp.moveTo(c.x, -c.y); any = true; }
    else if (c.type === 'L') sp.lineTo(c.x, -c.y);
    else if (c.type === 'Q') sp.quadraticCurveTo(c.x1, -c.y1, c.x, -c.y);
    else if (c.type === 'C') sp.bezierCurveTo(c.x1, -c.y1, c.x2, -c.y2, c.x, -c.y);
  }
  return any ? sp.toShapes(false) : [];
}
// accentMinY : les contours au-dessus de cette hauteur (l'accent de « é ») passent en bleu électrique
function textMesh(font, txt, size, tracking, depth, bevel, accentMinY = Infinity) {
  const g = new THREE.Group(); let x = 0; const sc = size / font.unitsPerEm;
  const opt = { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.7, bevelSegments: 6, curveSegments: 14 };
  for (const ch of txt) {
    const gl = font.charToGlyph(ch), shapes = glyphShapes(gl.getPath(x, 0, size));
    const nuit = [], bleu = [];
    for (const s of shapes) {
      const ys = s.getPoints().map(p => p.y);
      (Math.min(...ys) > accentMinY ? bleu : nuit).push(s);
    }
    if (nuit.length) g.add(mesh(new THREE.ExtrudeGeometry(nuit, opt).translate(0, 0, -depth / 2), matNuit));
    if (bleu.length) { const m = mesh(new THREE.ExtrudeGeometry(bleu, opt).translate(0, 0, -depth / 2), matBleu); m.position.z = depth * 0.15; g.add(m); }
    x += gl.advanceWidth * sc + tracking;
  }
  g.userData.width = x - tracking; return g;
}

const signature = new THREE.Group();
let ready = false;
Promise.all([loadFont(FONTS.mont), loadFont(FONTS.jost)]).then(([mont, jost]) => {
  const size = 2.3, xh = (mont.tables.os2.sxHeight || 520) / mont.unitsPerEm * size;
  const mot = textMesh(mont, 'Canopée', size, -0.05, 0.55, 0.045, xh * 1.04);
  const W = mot.userData.width;
  mot.position.set(-W / 2, -4.15, 0);
  const t0 = textMesh(jost, 'RÉSIDENCE', 0.46, 0, 0.14, 0.01).userData.width;
  const res = textMesh(jost, 'RÉSIDENCE', 0.46, (W * 0.62 - t0) / 8, 0.14, 0.01);
  res.position.set(-res.userData.width / 2, -5.15, 0);
  const trait = (x) => { const m = mesh(new THREE.BoxGeometry(0.75, 0.035, 0.06), matBleu); m.position.set(x, -4.98, 0); return m; };
  signature.add(mot, res, trait(-res.userData.width / 2 - 0.75), trait(res.userData.width / 2 + 0.75));
  ready = true; layout(); document.getElementById('load').style.opacity = 0;
}).catch(() => { document.getElementById('load').textContent = 'Le mot-symbole n’a pas pu être chargé.'; ready = true; layout(); });

const root = new THREE.Group(); root.add(symbole, signature); scene.add(root);

/* ---------- vues ---------- */
let vue = new URLSearchParams(location.search).get('vue') === 'symbole' ? 'symbole' : 'signature';
function layout() {
  signature.visible = vue === 'signature';
  root.position.y = 0;
  const box = new THREE.Box3().setFromObject(root);
  root.position.y = -box.min.y + 0.02;                     // posé sur le sol
  const b2 = new THREE.Box3().setFromObject(root), c = b2.getCenter(new THREE.Vector3()), s = b2.getSize(new THREE.Vector3());
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(s.y / (2 * t) * 1.45, s.x / (2 * t * camera.aspect) * (camera.aspect < 1 ? 1.12 : 1.45)) + s.z;
  controls.target.copy(c);
  camera.position.set(c.x + dist * 0.2, c.y + dist * 0.16, c.z + dist);
  controls.minDistance = dist * 0.5; controls.maxDistance = dist * 2.2;
  controls.update();
  document.querySelectorAll('[data-vue]').forEach(o => o.setAttribute('aria-pressed', o.dataset.vue === vue));
}
document.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => { vue = b.dataset.vue; layout(); });
function setFond(nuit) {
  document.documentElement.dataset.fond = nuit ? 'nuit' : '';
  document.getElementById('fond').setAttribute('aria-pressed', nuit);
  matNuit.color.set(nuit ? '#e9eef8' : '#0b214a');        // sur fond nuit, le bleu nuit devient blanc (comme la planche)
  matNuit.clearcoatRoughness = nuit ? 0.2 : 0.1;
  sol.material.opacity = nuit ? 0.4 : 0.16;
}
document.getElementById('fond').onclick = () => setFond(document.documentElement.dataset.fond !== 'nuit');
if (new URLSearchParams(location.search).get('fond') === 'nuit') setFond(true);
document.getElementById('png').onclick = () => {          // PNG transparent en haute définition
  const pr = renderer.getPixelRatio();
  renderer.setPixelRatio(Math.min(pr * 2, 4)); resize(); sol.visible = false; renderer.render(scene, camera);
  const a = document.createElement('a'); a.download = `canopee-logo-3d-${vue}.png`; a.href = canvas.toDataURL('image/png'); a.click();
  sol.visible = true; renderer.setPixelRatio(pr); resize();
};
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); layout(); });
resize(); layout();

let idle = 0; controls.addEventListener('start', () => idle = -1); controls.addEventListener('end', () => idle = 0);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches || new URLSearchParams(location.search).has('fixe');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (!still && idle >= 0) { idle += dt; root.rotation.y = Math.sin(t * 0.4) * 0.38 * Math.min(1, idle / 2); }
  if (!still) canopee.position.y = 1.2 + Math.sin(t * 1.0) * 0.04;      // la canopée respire à peine
  controls.update(); renderer.render(scene, camera);
});
window.__logo = { ready: () => ready, root, camera, controls, setVue: (v) => { vue = v; layout(); }, setFond };
</script>
</body>
</html>
